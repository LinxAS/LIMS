<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Create Forecast – LIMS</title>
  <link rel="stylesheet" href="/shared/lims.css"/>
</head>
<body>

<nav class="lims-nav">
  <span class="breadcrumb"><span class="nav-icon">📈</span> LIMS – Create Forecast</span>
  <a class="back-link" href="index.html">← Back to Manage Forecasts</a>
</nav>

<div class="lims-page">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:18px">
    <h1 class="page-title" style="margin:0">Create Forecast</h1>
    <button class="btn btn-secondary">📋 Copy From</button>
  </div>

  <!-- Header Information -->
  <div class="lims-panel">
    <h2>Header Information</h2>
    <div class="form-grid">
      <div class="field">
        <label>Forecast ID</label>
        <input id="fc-id" readonly placeholder="&lt;generated by system&gt;" class="auto-fill"/>
      </div>
      <div class="field">
        <label>Forecast Name</label>
        <input id="fc-name" placeholder="e.g. Q4 2026 Forecast"/>
      </div>
      <div class="field">
        <label>Requested For</label>
        <input id="fc-for" value="JJOSEPH"/>
      </div>
      <div class="field">
        <label>Needed By</label>
        <input id="fc-needed" type="date"/>
      </div>
    </div>
    <div class="form-grid-3">
      <div class="field">
        <label>Plant</label>
        <select id="fc-plant">
          <option value="NAIS">NAIS – North America Innovation Studio</option>
          <option value="NAIT">NAIT – North America Innovation Testing</option>
        </select>
      </div>
      <div class="field">
        <label>Laboratory</label>
        <select id="fc-lab">
          <option value="BODY DEVELOPMENT">Body Development Lab</option>
          <option value="HP LAB">HP Lab</option>
          <option value="HP PILOT LAB">HP Pilot Lab</option>
        </select>
      </div>
      <div class="field">
        <label>Category</label>
        <select id="fc-category">
          <option value="Raw Material">Raw Material</option>
          <option value="Fragrance">Fragrance</option>
          <option value="Packaging">Packaging</option>
        </select>
      </div>
    </div>
  </div>

  <!-- Items -->
  <div class="lims-panel">
    <h2>Items</h2>
    <div class="table-wrapper">
      <table class="items-table" id="items-table">
        <thead>
          <tr>
            <th style="width:80px">Item Number</th>
            <th style="width:160px">Specification Number</th>
            <th style="width:200px">Specification Description</th>
            <th style="width:150px">Material Number</th>
            <th style="width:180px">Material Description</th>
            <th style="width:80px">Quantity</th>
            <th style="width:70px">UoM</th>
            <th style="width:110px">Available Qty</th>
            <th style="width:40px"></th>
          </tr>
        </thead>
        <tbody id="items-body"></tbody>
      </table>
    </div>
    <button class="add-item-btn mt8" onclick="addItemRow()">⊕ Add Item</button>
  </div>

  <!-- Footer -->
  <div class="lims-footer">
    <div style="flex:1;display:flex;align-items:center">
      <span style="width:32px;height:32px;border-radius:50%;background:#1c3f6e;color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;">N</span>
    </div>
    <button class="btn btn-secondary" onclick="saveForecast('Draft')">Save as Draft</button>
    <button class="btn btn-primary" onclick="saveForecast('Submitted')">Submit</button>
    <button class="btn btn-ghost" onclick="window.location.href='index.html'">Cancel</button>
  </div>
</div>

<div id="toast"></div>

<script>
const ODATA = '/odata/v4/lims';
let itemCounter = 0;
let specs = [];

let inventoryAll = [];

async function init() {
  const [sr, mr, ir] = await Promise.all([
    fetch(`${ODATA}/Specifications`),
    fetch(`${ODATA}/Materials`),
    fetch(`${ODATA}/Inventory`)
  ]);
  const [sd, md, id2] = await Promise.all([sr.json(), mr.json(), ir.json()]);
  const matMap = {};
  for (const m of (md.value || [])) matMap[m.MaterialNumber] = m;
  specs = (sd.value || []).map(s => ({ ...s, material: matMap[s.material_MaterialNumber] || {} }));
  specs.sort((a, b) => a.SpecNumber < b.SpecNumber ? -1 : 1);
  inventoryAll = id2.value || [];
  addItemRow(); addItemRow(); addItemRow();
}

function addItemRow() {
  itemCounter++;
  const itemNum = itemCounter * 10;
  const tbody = document.getElementById('items-body');
  const tr = document.createElement('tr');
  tr.id = `row-${itemCounter}`;
  tr.innerHTML = `
    <td><input type="number" value="${itemNum}" readonly style="width:60px"/></td>
    <td>
      <input type="text" class="spec-num" placeholder="Enter spec #"
             list="sl-${itemCounter}"
             onchange="onSpecChange(this, '${itemCounter}')"
             oninput="onSpecChange(this, '${itemCounter}')"/>
      <datalist id="sl-${itemCounter}">
        ${specs.map(s=>`<option value="${s.SpecNumber}">${s.SpecNumber} – ${s.Description||''}</option>`).join('')}
      </datalist>
    </td>
    <td><input type="text" class="spec-desc auto-fill" readonly placeholder="Auto-filled"/></td>
    <td><input type="text" class="mat-num auto-fill" readonly placeholder="Auto-filled"/></td>
    <td><input type="text" class="mat-desc auto-fill" readonly placeholder="Auto-filled"/></td>
    <td><input type="number" class="qty" value="1" min="0.001" step="0.001" style="width:70px"/></td>
    <td>
      <select class="uom" style="width:60px">
        <option>KG</option><option>G</option><option>L</option><option>ML</option><option>EA</option>
      </select>
    </td>
    <td><input type="number" class="avail-qty auto-fill" value="0" readonly style="width:80px"/></td>
    <td><button class="btn-del" onclick="this.closest('tr').remove()">🗑</button></td>
  `;
  tbody.appendChild(tr);
}

async function onSpecChange(input, rowId) {
  const specNum = input.value.trim();
  const row = document.getElementById(`row-${rowId}`);
  if (!specNum || !row) return;
  const spec = specs.find(s => s.SpecNumber === specNum);
  if (spec) {
    row.querySelector('.spec-desc').value = spec.Description || '';
    row.querySelector('.mat-num').value   = spec.material_MaterialNumber || '';
    row.querySelector('.mat-desc').value  = spec.material?.Description || '';
    const inv = inventoryAll.find(i => i.spec_SpecNumber === specNum);
    row.querySelector('.avail-qty').value = inv ? (inv.TotalAvailable || 0) : 0;
  }
}

async function saveForecast(status) {
  const fcName = document.getElementById('fc-name').value.trim();
  if (!fcName) { showToast('Forecast Name is required', 'error'); return; }

  const plant    = document.getElementById('fc-plant').value;
  const lab      = document.getElementById('fc-lab').value;
  const category = document.getElementById('fc-category').value;
  const fcFor    = document.getElementById('fc-for').value || 'JJOSEPH';
  const neededBy = document.getElementById('fc-needed').value;

  const rows = document.querySelectorAll('#items-body tr');
  const items = [];
  rows.forEach((row, idx) => {
    const specNum = row.querySelector('.spec-num')?.value?.trim();
    if (!specNum) return;
    items.push({
      ItemNumber           : (idx + 1) * 10,
      spec_SpecNumber      : specNum,
      material_MaterialNumber: row.querySelector('.mat-num')?.value || null,
      Quantity             : parseFloat(row.querySelector('.qty')?.value) || 1,
      UoM                  : row.querySelector('.uom')?.value || 'KG',
      AvailableQtyInPlant  : parseFloat(row.querySelector('.avail-qty')?.value) || 0,
      ItemStatus           : 'New',
      RequestedFor         : fcFor,
      NeededBy             : neededBy || null
    });
  });

  const today = new Date().toISOString().slice(0,10);
  const fcID  = `FOR-${Math.floor(1000 + Math.random() * 9000)}`;

  const body = {
    ForecastID    : fcID,
    ForecastName  : fcName,
    RequestedFor  : fcFor,
    NeededBy      : neededBy || null,
    plant_PlantCode: plant,
    lab_LabCode   : lab,
    Category      : category,
    Status        : status,
    CreatedBy     : 'JJOSEPH',
    DateSubmitted : status === 'Submitted' ? today : null,
    items
  };

  try {
    const r = await fetch(`${ODATA}/Forecasts`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
    if (r.ok) {
      showToast(`Forecast ${fcID} saved as ${status}`, 'success');
      setTimeout(() => { window.location.href = 'index.html'; }, 1800);
    } else {
      const err = await r.json();
      showToast(err?.error?.message || 'Error saving forecast', 'error');
    }
  } catch(e) { showToast('Network error', 'error'); }
}

function showToast(msg, type='info') {
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = `show ${type}`;
  setTimeout(() => t.className = '', 3000);
}

init();
</script>
</body>
</html>
