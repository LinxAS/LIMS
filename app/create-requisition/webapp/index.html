<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Create Requisition – LIMS</title>
  <link rel="stylesheet" href="/shared/lims.css"/>
</head>
<body>

<!-- Nav -->
<nav class="lims-nav">
  <span class="breadcrumb">
    <span class="nav-icon">📋</span>
    LIMS – Create Requisition
  </span>
  <a class="back-link" href="../../launchpad.html">🏠 Back to Launchpad</a>
</nav>

<div class="lims-page">
  <h1 class="page-title">Create Requisition</h1>

  <!-- Header Information -->
  <div class="lims-panel">
    <h2>Header Information</h2>
    <div class="form-grid">
      <div class="field">
        <label>Requisition ID</label>
        <input id="req-id" readonly placeholder="&lt;generated by system&gt;" class="auto-fill"/>
      </div>
      <div class="field">
        <label>Requisition Name</label>
        <input id="req-name" placeholder="Is this needed?"/>
      </div>
      <div class="field">
        <label>Requested For</label>
        <input id="req-for" placeholder="Default to user" value="JJOSEPH"/>
      </div>
      <div class="field">
        <label>Needed By</label>
        <input id="needed-by" type="date"/>
      </div>
    </div>
    <div class="form-grid-3">
      <div class="field">
        <label>Plant</label>
        <select id="plant">
          <option value="">Default based on user profile</option>
          <option value="NAIS" selected>NAIS – North America Innovation Studio</option>
          <option value="NAIT">NAIT – North America Innovation Testing</option>
        </select>
      </div>
      <div class="field">
        <label>Laboratory</label>
        <select id="lab">
          <option value="">Default based on user profile (optional)</option>
          <option value="BODY DEVELOPMENT" selected>Body Development Lab</option>
          <option value="HP LAB">HP Lab</option>
          <option value="HP PILOT LAB">HP Pilot Lab</option>
        </select>
      </div>
      <div class="field">
        <label>Category</label>
        <select id="category">
          <option value="Raw Material" selected>Raw Material</option>
          <option value="Fragrance">Fragrance</option>
          <option value="Packaging">Packaging</option>
        </select>
      </div>
    </div>
  </div>

  <!-- Items -->
  <div class="lims-panel">
    <h2>Items</h2>
    <div class="table-wrapper">
      <table class="items-table" id="items-table">
        <thead>
          <tr>
            <th style="width:80px">Item Number</th>
            <th style="width:160px">Specification Number</th>
            <th style="width:200px">Specification Description</th>
            <th style="width:150px">Material Number</th>
            <th style="width:180px">Material Description</th>
            <th style="width:80px">Quantity</th>
            <th style="width:70px">UoM</th>
            <th style="width:100px">Available Qty</th>
            <th style="width:40px"></th>
          </tr>
        </thead>
        <tbody id="items-body"></tbody>
      </table>
    </div>
    <button class="add-item-btn mt8" onclick="addItemRow()">⊕ Add Item</button>
  </div>

  <!-- Footer -->
  <div class="lims-footer">
    <div style="flex:1; display:flex; align-items:center;">
      <span style="width:32px;height:32px;border-radius:50%;background:#1c3f6e;color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;">N</span>
    </div>
    <button class="btn btn-secondary" onclick="saveRequisition('Draft')">Save as Draft</button>
    <button class="btn btn-primary" onclick="saveRequisition('Submitted')">Submit</button>
    <button class="btn btn-ghost" onclick="window.location.href='../../manage-requisitions/webapp/index.html'">Cancel</button>
  </div>
</div>

<div id="toast"></div>

<script>
const ODATA = '/odata/v4/lims';
let itemCounter = 0;
let specs = [];

let inventoryAll = [];   // all inventory rows for client-side lookup

async function init() {
  // Fetch specs and materials separately (no $expand)
  const [sr, mr, ir] = await Promise.all([
    fetch(`${ODATA}/Specifications`),
    fetch(`${ODATA}/Materials`),
    fetch(`${ODATA}/Inventory`)
  ]);
  const [sd, md, id2] = await Promise.all([sr.json(), mr.json(), ir.json()]);

  const matMap = {};
  for (const m of (md.value || [])) matMap[m.MaterialNumber] = m;

  // Enrich specs with material
  specs = (sd.value || []).map(s => ({ ...s, material: matMap[s.material_MaterialNumber] || {} }));
  specs.sort((a, b) => a.SpecNumber < b.SpecNumber ? -1 : 1);

  inventoryAll = id2.value || [];

  // Start with 3 blank rows
  addItemRow(); addItemRow(); addItemRow();
}

function addItemRow() {
  itemCounter++;
  const itemNum = itemCounter * 10;
  const tbody = document.getElementById('items-body');
  const tr = document.createElement('tr');
  tr.id = `row-${itemCounter}`;
  tr.innerHTML = `
    <td><input type="number" class="item-num" value="${itemNum}" readonly style="width:60px"/></td>
    <td>
      <input type="text" class="spec-num" placeholder="Enter spec #"
             list="spec-list-${itemCounter}"
             onchange="onSpecChange(this, '${itemCounter}')"
             oninput="onSpecChange(this, '${itemCounter}')"/>
      <datalist id="spec-list-${itemCounter}">
        ${specs.map(s=>`<option value="${s.SpecNumber}">${s.SpecNumber} – ${s.Description}</option>`).join('')}
      </datalist>
    </td>
    <td><input type="text" class="spec-desc auto-fill" placeholder="Auto-filled" readonly/></td>
    <td><input type="text" class="mat-num auto-fill" placeholder="Auto-filled" readonly/></td>
    <td><input type="text" class="mat-desc auto-fill" placeholder="Auto-filled" readonly/></td>
    <td><input type="number" class="qty" value="1" min="0.001" step="0.001" style="width:70px"/></td>
    <td>
      <select class="uom" style="width:60px">
        <option>KG</option><option>G</option><option>L</option><option>ML</option><option>EA</option>
      </select>
    </td>
    <td><input type="number" class="avail-qty auto-fill" value="0" readonly style="width:80px"/></td>
    <td><button class="btn-del" onclick="removeRow('row-${itemCounter}')">🗑</button></td>
  `;
  tbody.appendChild(tr);
  tr.querySelector('.spec-num').focus();
}

function removeRow(id) {
  const el = document.getElementById(id);
  if (el) el.remove();
}

async function onSpecChange(input, rowId) {
  const specNum = input.value.trim();
  const row = document.getElementById(`row-${rowId}`);
  if (!specNum || !row) return;

  const spec = specs.find(s => s.SpecNumber === specNum);
  if (spec) {
    row.querySelector('.spec-desc').value = spec.Description || '';
    row.querySelector('.mat-num').value  = spec.material_MaterialNumber || '';
    row.querySelector('.mat-desc').value = spec.material?.Description || '';
    // Look up available qty client-side (inventoryAll already loaded)
    const inv = inventoryAll.find(i => i.spec_SpecNumber === specNum);
    row.querySelector('.avail-qty').value = inv ? (inv.TotalAvailable || 0) : 0;
  }
}

async function saveRequisition(status) {
  const reqName = document.getElementById('req-name').value.trim();
  if (!reqName) { showToast('Requisition Name is required', 'error'); return; }

  const neededBy  = document.getElementById('needed-by').value;
  const plant     = document.getElementById('plant').value || 'NAIS';
  const lab       = document.getElementById('lab').value || 'BODY DEVELOPMENT';
  const category  = document.getElementById('category').value || 'Raw Material';
  const reqFor    = document.getElementById('req-for').value || 'JJOSEPH';

  const rows = document.querySelectorAll('#items-body tr');
  const items = [];
  rows.forEach((row, idx) => {
    const specNum = row.querySelector('.spec-num')?.value?.trim();
    if (!specNum) return;
    items.push({
      ItemNumber            : (idx + 1) * 10,
      spec_SpecNumber       : specNum,
      material_MaterialNumber: row.querySelector('.mat-num')?.value || null,
      Quantity              : parseFloat(row.querySelector('.qty')?.value) || 1,
      UoM                   : row.querySelector('.uom')?.value || 'KG',
      AvailableQty          : parseFloat(row.querySelector('.avail-qty')?.value) || 0,
      Criticality           : 3
    });
  });

  const now = new Date();
  const today = now.toISOString().slice(0, 10);
  const reqID = `REQ-${Math.floor(1000 + Math.random() * 9000)}`;

  async function postJSON(url, payload) {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), 15000);
    const r = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
      signal: ctrl.signal
    });
    clearTimeout(timer);
    return r;
  }

  try {
    // Step 1: create the requisition header (no deep insert)
    const headerBody = {
      RequisitionID   : reqID,
      RequisitionName : reqName,
      RequestedFor    : reqFor,
      NeededBy        : neededBy || null,
      plant_PlantCode : plant,
      lab_LabCode     : lab,
      Category        : category,
      Status          : status,
      CreatedBy       : 'JJOSEPH',
      CreatedOn       : today
    };
    const hr = await postJSON(`${ODATA}/Requisitions`, headerBody);
    if (!hr.ok) {
      const txt = await hr.text();
      let msg = 'Error saving requisition';
      try { msg = JSON.parse(txt)?.error?.message || msg; } catch(_) { msg = txt.slice(0,120) || msg; }
      showToast(`HTTP ${hr.status}: ${msg}`, 'error'); return;
    }

    // Step 2: create each item separately
    for (const item of items) {
      const ir = await postJSON(`${ODATA}/RequisitionItems`, {
        ...item,
        requisition_RequisitionID: reqID
      });
      if (!ir.ok) {
        const txt = await ir.text();
        let msg = 'Error saving item';
        try { msg = JSON.parse(txt)?.error?.message || msg; } catch(_) { msg = txt.slice(0,80) || msg; }
        showToast(`Item error: ${msg}`, 'error'); return;
      }
    }

    showToast(`Requisition ${reqID} saved as ${status}`, 'success');
    setTimeout(() => { window.location.href = '../../manage-requisitions/webapp/index.html'; }, 1800);
  } catch(e) {
    showToast(e.name === 'AbortError' ? 'Request timed out — server too slow' : `Network error: ${e.message}`, 'error');
  }
}

function showToast(msg, type='info') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = `show ${type}`;
  setTimeout(() => { t.className = ''; }, 3000);
}

init();
</script>
</body>
</html>
